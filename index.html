<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kim Chi - Thế Giới Kỳ Thú</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

        :root {
            --glass-bg: rgba(30, 60, 120, 0.35);
            --glass-border: rgba(255, 255, 255, 0.4);
            --accent-blue: #4facfe;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle at center, #1e3c72, #2a5298);
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid var(--glass-border);
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .glass-card.selected {
            background: rgba(79, 172, 254, 0.5);
            border-color: #fff;
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 20px var(--accent-blue);
        }

        .animal-sprite {
            font-size: clamp(4rem, 12vh, 8rem);
            pointer-events: auto;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.5));
            z-index: 10;
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glow-active {
            filter: drop-shadow(0 0 25px #fff) drop-shadow(0 0 45px var(--accent-blue)) !important;
            transform: scale(1.2) rotate(10deg);
        }

        /* Hiệu ứng vòng tròn lan tỏa */
        .click-ripple {
            position: absolute;
            border: 4px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: ripple-effect 0.6s ease-out forwards;
            z-index: 100;
        }

        @keyframes ripple-effect {
            0% { width: 0; height: 0; opacity: 1; border-width: 4px; }
            100% { width: 150px; height: 150px; opacity: 0; border-width: 1px; }
        }

        /* Hiệu ứng sao văng lấp lánh nhiều màu */
        .star-particle {
            position: absolute;
            pointer-events: none;
            z-index: 150;
            animation: star-burst 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            text-shadow: 0 0 10px currentColor;
        }

        @keyframes star-burst {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 1; }
            50% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(var(--s)) rotate(var(--r)); opacity: 0; }
        }

        .particle-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            opacity: 0.3;
            filter: blur(1px);
            animation: fall-random linear infinite;
        }

        @keyframes fall-random {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(110vh) translateX(20px) rotate(360deg); opacity: 0; }
        }

        .hidden-screen { display: none !important; }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        .shadow-slot {
            aspect-ratio: 1/1;
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shadow-slot.matched {
            background: rgba(79, 172, 254, 0.2);
            border: 2px solid var(--accent-blue);
        }

        .habitat-zone {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .habitat-zone:hover {
            transform: scale(1.01);
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div id="game-container" class="w-full h-full flex flex-col">
        <!-- MENU CHÍNH -->
        <div id="main-menu" class="h-full flex flex-col items-center justify-center p-6 animate__animated animate__fadeIn">
            <div class="glass-panel p-10 max-w-3xl w-full text-center space-y-10">
                <div class="space-y-2">
                    <h1 class="text-8xl font-black italic text-white tracking-tighter drop-shadow-lg uppercase">KIM CHI</h1>
                    <p class="text-blue-200 uppercase tracking-[0.3em] text-xs font-bold">Thế giới động vật vui nhộn</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <button onclick="startGame('shadow')" class="glass-card p-8 flex flex-col items-center gap-4 hover:bg-white/20">
                        <span class="text-6xl">🔍</span>
                        <span class="font-black text-sm uppercase">Thám Tử<br>Rừng Xanh</span>
                    </button>
                    <button onclick="startGame('count')" class="glass-card p-8 flex flex-col items-center gap-4 hover:bg-white/20">
                        <span class="text-6xl">🔢</span>
                        <span class="font-black text-sm uppercase">Lớp Học<br>Đếm Sao</span>
                    </button>
                    <button onclick="startGame('sort')" class="glass-card p-8 flex flex-col items-center gap-4 hover:bg-white/20">
                        <span class="text-6xl">🏡</span>
                        <span class="font-black text-sm uppercase">Về Nhà<br>Thôi Nào</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- MÀN CHƠI -->
        <div id="game-play" class="hidden-screen h-full flex flex-col p-6 animate__animated animate__fadeIn">
            <header class="flex justify-between items-center mb-4 max-w-6xl w-full mx-auto">
                <button onclick="backToMenu()" class="glass-card w-14 h-14 text-2xl flex items-center justify-center shadow-lg">🏠</button>
                <div class="flex gap-3">
                    <div class="glass-panel px-6 py-2 text-lg font-black italic">CẤP <span id="level-display">1</span></div>
                    <div class="glass-panel px-6 py-2 text-lg font-black text-yellow-300">⭐ <span id="score-display">0</span></div>
                </div>
            </header>

            <div id="game-content" class="flex-grow flex flex-col items-center justify-center w-full max-w-6xl mx-auto overflow-hidden"></div>
        </div>

        <!-- MODAL CHIẾN THẮNG -->
        <div id="success-modal" class="hidden-screen absolute inset-0 z-[200] flex items-center justify-center bg-blue-900/60 backdrop-blur-xl">
            <div class="glass-panel p-10 text-center animate__animated animate__backInDown max-w-md w-full">
                <div class="text-8xl mb-6 animate__animated animate__tada animate__infinite">🏆</div>
                <h2 class="text-5xl font-black mb-2 italic">XUẤT SẮC!</h2>
                <p class="text-blue-100 mb-10 font-bold uppercase tracking-widest text-sm">Bé thật là thông minh</p>
                <button id="next-btn" class="w-full py-6 text-2xl font-black uppercase bg-white text-blue-900 rounded-3xl shadow-2xl active:scale-95 transition-transform">TIẾP TỤC ➔</button>
            </div>
        </div>
    </div>

    <script>
        const ALL_ANIMALS = [
            { id: 'lion', emoji: '🦁', habitat: 'land', type: 'forest', particles: ['🍃', '🐾', '🍂'] },
            { id: 'tiger', emoji: '🐯', habitat: 'land', type: 'forest', particles: ['🍃', '🐾', '🌿'] },
            { id: 'elephant', emoji: '🐘', habitat: 'land', type: 'forest', particles: ['🍃', '🌳', '💧'] },
            { id: 'monkey', emoji: '🐒', habitat: 'land', type: 'forest', particles: ['🍌', '🍃', '🌴'] },
            { id: 'giraffe', emoji: '🦒', habitat: 'land', type: 'forest', particles: ['🍃', '🦒', '🌿'] },
            { id: 'zebra', emoji: '🦓', habitat: 'land', type: 'forest', particles: ['🍃', '🐾', '🌾'] },
            { id: 'hippo', emoji: '🦛', habitat: 'land', type: 'forest', particles: ['💧', '🌿', '🍃'] },
            { id: 'fox', emoji: '🦊', habitat: 'land', type: 'forest', particles: ['🍂', '🍃', '🦊'] },
            { id: 'rabbit', emoji: '🐰', habitat: 'land', type: 'garden', particles: ['🥕', '🌸', '🍀'] },
            { id: 'bee', emoji: '🐝', habitat: 'land', type: 'garden', particles: ['🌻', '🍯', '🌸'] },
            { id: 'butterfly', emoji: '🦋', habitat: 'land', type: 'garden', particles: ['🦋', '🌸', '✨'] },
            { id: 'ladybug', emoji: '🐞', habitat: 'land', type: 'garden', particles: ['🍀', '🐞', '🌸'] },
            { id: 'whale', emoji: '🐋', habitat: 'water', type: 'ocean', particles: ['🫧', '🐳', '💦'] },
            { id: 'shark', emoji: '🦈', habitat: 'water', type: 'ocean', particles: ['🫧', '🦈', '🌊'] },
            { id: 'dolphin', emoji: '🐬', habitat: 'water', type: 'ocean', particles: ['🫧', '🐬', '💦'] },
            { id: 'octopus', emoji: '🐙', habitat: 'water', type: 'ocean', particles: ['🫧', '🐙', '🐚'] },
            { id: 'crab', emoji: '🦀', habitat: 'water', type: 'ocean', particles: ['🦀', '🐚', '🏖️'] },
            { id: 'fish', emoji: '🐠', habitat: 'water', type: 'ocean', particles: ['🐠', '🫧', '🌿'] },
            { id: 'turtle', emoji: '🐢', habitat: 'water', type: 'ocean', particles: ['🐢', '🫧', '🐚'] },
            { id: 'shrimp', emoji: '🦐', habitat: 'water', type: 'ocean', particles: ['🦐', '🫧', '🐚'] }
        ];

        let state = { 
            game: null, level: 1, score: 0, activeId: null, 
            audio: null, matchedCount: 0, totalToMatch: 0,
            usedInSession: []
        };

        const playSfx = (type) => {
            try {
                if (!state.audio) state.audio = new (window.AudioContext || window.webkitAudioContext)();
                const ctx = state.audio;
                const g = ctx.createGain(); g.connect(ctx.destination);
                
                if (type === 'correct') {
                    g.gain.setValueAtTime(0.1, ctx.currentTime);
                    const o = ctx.createOscillator();
                    o.type = 'sine'; o.frequency.setValueAtTime(400, ctx.currentTime);
                    o.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.15);
                    o.connect(g); o.start(); o.stop(ctx.currentTime + 0.2);
                } else if (type === 'victory') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = ctx.createOscillator();
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
                        const oG = ctx.createGain();
                        oG.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.1);
                        oG.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.3);
                        o.connect(oG); oG.connect(ctx.destination);
                        o.start(ctx.currentTime + i * 0.1); o.stop(ctx.currentTime + i * 0.1 + 0.4);
                    });
                } else if (type === 'pop') {
                    g.gain.setValueAtTime(0.05, ctx.currentTime);
                    const o = ctx.createOscillator();
                    o.type = 'sine'; o.frequency.setValueAtTime(600, ctx.currentTime);
                    o.connect(g); o.start(); o.stop(ctx.currentTime + 0.1);
                } else {
                    g.gain.setValueAtTime(0.05, ctx.currentTime);
                    const o = ctx.createOscillator();
                    o.type = 'sawtooth'; o.frequency.setValueAtTime(120, ctx.currentTime);
                    o.connect(g); o.start(); o.stop(ctx.currentTime + 0.2);
                }
            } catch(e){}
        };

        function startGame(type) {
            state.game = type; state.level = 1; state.score = 0; state.usedInSession = [];
            document.getElementById('main-menu').classList.add('hidden-screen');
            document.getElementById('game-play').classList.remove('hidden-screen');
            loadLevel();
        }

        function backToMenu() {
            document.getElementById('main-menu').classList.remove('hidden-screen');
            document.getElementById('game-play').classList.add('hidden-screen');
            document.getElementById('success-modal').classList.add('hidden-screen');
        }

        function loadLevel() {
            document.getElementById('level-display').innerText = state.level;
            document.getElementById('score-display').innerText = state.score;
            document.getElementById('success-modal').classList.add('hidden-screen');
            const container = document.getElementById('game-content');
            container.innerHTML = ''; 
            state.activeId = null;
            state.matchedCount = 0;
            
            if (state.game === 'shadow') initShadow(container);
            else if (state.game === 'count') initCount(container);
            else if (state.game === 'sort') initSort(container);
        }

        function getDiverseAnimals(count) {
            let unused = ALL_ANIMALS.filter(a => !state.usedInSession.includes(a.id));
            if (unused.length < count) {
                state.usedInSession = [];
                unused = [...ALL_ANIMALS];
            }
            const selection = unused.sort(() => 0.5 - Math.random()).slice(0, count);
            selection.forEach(a => state.usedInSession.push(a.id));
            return selection;
        }

        function createRippleAt(x, y, parent) {
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            parent.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        // Tạo hiệu ứng sao văng lấp lánh với nhiều màu sắc
        function createStarBurstAt(x, y) {
            const colors = ['#FFD700', '#FF69B4', '#00FF7F', '#00BFFF', '#FFFFFF', '#FF4500', '#DA70D6'];
            const starCount = 20;
            
            for(let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star-particle';
                star.innerText = '⭐';
                star.style.left = x + 'px';
                star.style.top = y + 'px';
                
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                star.style.color = randomColor;
                
                const size = Math.random() * 25 + 15;
                star.style.fontSize = size + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 200 + 100;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                star.style.setProperty('--tx', `${tx}px`);
                star.style.setProperty('--ty', `${ty}px`);
                star.style.setProperty('--r', `${Math.random() * 720}deg`);
                star.style.setProperty('--s', `${Math.random() * 1.5 + 1}`);
                
                document.body.appendChild(star);
                setTimeout(() => star.remove(), 1200);
            }
        }

        function initShadow(container) {
            const count = 5;
            state.totalToMatch = count;
            const targets = getDiverseAnimals(count);
            const options = [...targets].sort(() => 0.5 - Math.random());

            const gridContainer = document.createElement('div');
            gridContainer.className = "w-full max-w-4xl animate__animated animate__fadeInDown";
            const grid = document.createElement('div');
            grid.className = "grid grid-cols-5 gap-4";
            gridContainer.appendChild(grid);

            const pool = document.createElement('div');
            pool.className = "flex flex-wrap justify-center gap-6 p-6 glass-panel w-full animate__animated animate__fadeInUp mt-8";

            targets.forEach(a => {
                const slot = document.createElement('div');
                slot.className = "shadow-slot";
                slot.innerHTML = `<span class="shadow-img" style="filter: brightness(0) opacity(0.3); font-size: 5rem;">${a.emoji}</span>`;
                slot.onclick = (e) => {
                    createRippleAt(e.clientX, e.clientY, document.body);
                    if (state.activeId === a.id && !slot.classList.contains('matched')) {
                        slot.classList.add('matched');
                        slot.innerHTML = `<span class="animal-sprite animate__animated animate__bounceIn" style="font-size: 5.5rem;">${a.emoji}</span>`;
                        const card = pool.querySelector(`[data-id="${a.id}"]`);
                        if(card) card.style.visibility = 'hidden';
                        
                        // HIỆU ỨNG VĂNG SAO TRÒ 1
                        createStarBurstAt(e.clientX, e.clientY);
                        
                        playSfx('correct'); state.score += 20; state.matchedCount++;
                        state.activeId = null;
                        if(state.matchedCount === state.totalToMatch) setTimeout(finishLevel, 800);
                    } else if (state.activeId) {
                        playSfx('wrong');
                        slot.classList.add('shake');
                        setTimeout(() => slot.classList.remove('shake'), 500);
                        document.querySelectorAll('.glass-card').forEach(el => el.classList.remove('selected'));
                        state.activeId = null;
                    }
                };
                grid.appendChild(slot);
            });

            options.forEach(a => {
                const card = document.createElement('div');
                card.className = "glass-card w-24 h-24 md:w-32 md:h-32 flex items-center justify-center";
                card.dataset.id = a.id;
                card.innerHTML = `<span class="animal-sprite" style="font-size: 4rem;">${a.emoji}</span>`;
                card.onclick = (e) => {
                    createRippleAt(e.clientX, e.clientY, document.body);
                    playSfx('pop');
                    document.querySelectorAll('.glass-card').forEach(el => el.classList.remove('selected'));
                    state.activeId = a.id;
                    card.classList.add('selected');
                };
                pool.appendChild(card);
            });

            container.appendChild(gridContainer); container.appendChild(pool);
        }

        function initCount(container) {
            const count = Math.floor(Math.random() * 5) + 3;
            const animal = getDiverseAnimals(1)[0];
            const board = document.createElement('div');
            board.className = `count-board glass-panel relative flex flex-wrap justify-center items-center gap-12 p-12 mb-8 w-full flex-grow animate__animated animate__zoomIn overflow-hidden`;
            
            const pContainer = document.createElement('div');
            pContainer.className = 'particle-container';
            for(let i=0; i<30; i++) {
                const p = document.createElement('span');
                p.className = 'particle';
                p.innerText = animal.particles[Math.floor(Math.random() * animal.particles.length)];
                p.style.left = Math.random() * 100 + '%';
                p.style.fontSize = (Math.random() * 20 + 20) + 'px';
                p.style.animationDuration = (Math.random() * 4 + 4) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                pContainer.appendChild(p);
            }
            board.appendChild(pContainer);

            for(let i=0; i<count; i++){
                const a = document.createElement('div');
                a.className = "animal-sprite cursor-pointer flex items-center justify-center";
                a.innerText = animal.emoji;
                a.onclick = (e) => { 
                    e.stopPropagation();
                    createRippleAt(e.clientX, e.clientY, document.body);
                    playSfx('pop'); 
                    a.classList.toggle('glow-active');
                };
                board.appendChild(a);
            }

            const answers = document.createElement('div');
            answers.className = "grid grid-cols-3 gap-6 w-full max-w-lg animate__animated animate__fadeInUp relative z-10";
            let nums = [count, count+1, count+2].sort(() => 0.5 - Math.random());
            if(!nums.includes(count)) nums[0] = count;
            
            nums.sort((a,b)=>a-b).forEach(n => {
                const b = document.createElement('button');
                b.className = "glass-panel h-24 text-5xl text-white font-black hover:bg-white/30 transition-all";
                b.innerText = n;
                b.onclick = (e) => {
                    createRippleAt(e.clientX, e.clientY, document.body);
                    if(n === count) { 
                        // HIỆU ỨNG VĂNG SAO TRÒ 2 (Giữ nguyên)
                        createStarBurstAt(e.clientX, e.clientY);
                        
                        playSfx('correct'); state.score += 25; 
                        setTimeout(finishLevel, 1200);
                    } else { 
                        playSfx('wrong'); 
                        b.classList.add('shake'); 
                        setTimeout(() => b.classList.remove('shake'), 500);
                    }
                };
                answers.appendChild(b);
            });
            container.appendChild(board); container.appendChild(answers);
        }

        function initSort(container) {
            const count = 6;
            state.totalToMatch = count;
            const animals = getDiverseAnimals(count);
            
            const worlds = document.createElement('div');
            worlds.className = "flex gap-6 w-full h-[45vh] mb-8 animate__animated animate__fadeInDown";
            
            const landZone = document.createElement('div');
            landZone.className = "habitat-zone relative flex-1 border-4 rounded-[40px] flex flex-wrap content-center justify-center gap-4 p-12";
            landZone.style.borderColor = "#4caf50";
            landZone.style.background = "rgba(34, 139, 34, 0.15)";
            landZone.dataset.zoneType = 'land';
            landZone.innerHTML = `<span class="absolute top-4 left-6 bg-white text-green-800 px-6 py-2 rounded-full font-bold text-lg shadow-lg z-20">🏡 TRÊN CẠN</span>`;
            
            const waterZone = document.createElement('div');
            waterZone.className = "habitat-zone relative flex-1 border-4 rounded-[40px] flex flex-wrap content-center justify-center gap-4 p-12";
            waterZone.style.borderColor = "#00bfff";
            waterZone.style.background = "rgba(0, 191, 255, 0.15)";
            waterZone.dataset.zoneType = 'water';
            waterZone.innerHTML = `<span class="absolute top-4 left-6 bg-white text-blue-800 px-6 py-2 rounded-full font-bold text-lg shadow-lg z-20">🌊 DƯỚI NƯỚC</span>`;

            const pool = document.createElement('div');
            pool.className = "glass-panel w-full max-w-4xl p-6 animate__animated animate__fadeInUp";
            
            const poolGrid = document.createElement('div');
            poolGrid.className = "grid grid-cols-6 gap-6 justify-items-center";
            pool.appendChild(poolGrid);

            [landZone, waterZone].forEach(zone => {
                zone.onclick = (e) => {
                    createRippleAt(e.clientX, e.clientY, document.body);
                    if (state.activeId) {
                        const a = ALL_ANIMALS.find(i => i.id === state.activeId);
                        if (a.habitat === zone.dataset.zoneType) {
                            // HIỆU ỨNG VĂNG SAO TRÒ 3
                            createStarBurstAt(e.clientX, e.clientY);
                            
                            playSfx('correct'); state.score += 20; state.matchedCount++;
                            const card = poolGrid.querySelector(`[data-id="${state.activeId}"]`);
                            if(card) card.style.visibility = 'hidden';
                            const mini = document.createElement('div');
                            mini.className = "text-7xl animate__animated animate__jackInTheBox";
                            mini.innerText = a.emoji;
                            zone.appendChild(mini);
                            state.activeId = null;
                            if(state.matchedCount === state.totalToMatch) setTimeout(finishLevel, 800);
                        } else {
                            playSfx('wrong');
                            zone.classList.add('shake');
                            setTimeout(() => zone.classList.remove('shake'), 500);
                            state.activeId = null;
                            document.querySelectorAll('.glass-card').forEach(el => el.classList.remove('selected'));
                        }
                    }
                };
            });

            animals.forEach(a => {
                const card = document.createElement('div');
                card.className = "glass-card w-24 h-24 flex items-center justify-center";
                card.dataset.id = a.id;
                card.innerHTML = `<span class="animal-sprite" style="font-size: 4rem;">${a.emoji}</span>`;
                card.onclick = (e) => {
                    createRippleAt(e.clientX, e.clientY, document.body);
                    playSfx('pop');
                    document.querySelectorAll('.glass-card').forEach(el => el.classList.remove('selected'));
                    state.activeId = a.id;
                    card.classList.add('selected');
                };
                poolGrid.appendChild(card);
            });

            worlds.appendChild(landZone); worlds.appendChild(waterZone);
            container.appendChild(worlds); container.appendChild(pool);
        }

        function finishLevel() {
            playSfx('victory');
            const modal = document.getElementById('success-modal');
            const nextBtn = document.getElementById('next-btn');
            if (state.level >= 10) {
                document.querySelector('#success-modal h2').innerText = "SIÊU NHÂN! 🏆";
                nextBtn.innerText = "CHƠI LẠI TỪ ĐẦU";
                nextBtn.onclick = () => startGame(state.game);
            } else {
                nextBtn.onclick = () => { state.level++; loadLevel(); };
            }
            modal.classList.remove('hidden-screen');
        }
    </script>
</body>
</html>
